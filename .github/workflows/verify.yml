name: Verify compiler and production
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm test
      - run: npm run check
      - run: npm run demo
      - run: node production/tools/import-game.mjs --game production/build/demo/game --out build/import-demo
      - run: npm run audit
